<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My Todo List</h1>
        
        <div class="input-container">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Add a new task..." 
                class="todo-input"
            >
            <button id="addButton" class="add-btn">Add Task</button>
        </div>
        
        <div class="filter-container">
            <button id="filterAll" class="filter-btn active" data-filter="all">All</button>
            <button id="filterActive" class="filter-btn" data-filter="active">Active</button>
            <button id="filterCompleted" class="filter-btn" data-filter="completed">Completed</button>
        </div>
        
        <ul id="taskList" class="todo-list"></ul>
        
        <div class="stats" id="stats">
            Total: 0 | Completed: 0
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
